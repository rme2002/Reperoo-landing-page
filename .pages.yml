media:
  input: public/images
  output: /images
  categories: [image]
  rename: safe

components:
  href:
    label: Link
    type: string
    description: A page path (/blog), a section on the home page (/#pricing) or a full URL.

  link:
    type: object
    fields:
      - name: label
        type: string
      - name: href
        component: href

  eyebrow:
    label: Small label above the title
    type: string

  subtitle:
    label: Text under the title
    type: text

  enabled:
    label: Show this section
    type: boolean

  icon:
    type: select
    options:
      values:
        - { name: shield, label: Shield }
        - { name: tag, label: Price tag }
        - { name: photo, label: Photo }
        - { name: live-photo, label: Live Photo }
        - { name: folder, label: Folder }
        - { name: usb, label: USB }
        - { name: cloud-off, label: No cloud }
        - { name: gauge, label: Speed }
        - { name: layout, label: Board }
        - { name: users, label: People }
        - { name: bolt, label: Lightning }
        - { name: chart, label: Chart }
        - { name: lock, label: Lock }
        - { name: device, label: Phone }
        - { name: heart, label: Heart }
        - { name: rocket, label: Rocket }
        - { name: clock, label: Clock }
        - { name: leaf, label: Leaf }
        - { name: palette, label: Palette }
        - { name: sparkles, label: Sparkles }

content:
  - name: home
    label: Home page
    type: file
    path: content/home.json
    format: json
    fields:
      - name: hero
        label: Hero
        type: object
        fields:
          - name: eyebrow
            component: eyebrow
          - name: title
            type: string
            required: true
          - name: subtitle
            type: text
          - name: primaryCta
            label: Primary button
            component: link
          - name: secondaryCta
            label: Secondary button
            component: link
          - name: image
            type: image
            description: Shown when the animated demo is off.
          - name: imageAlt
            label: Image description
            type: string
            description: Describes the image or demo for screen readers and search engines.
          - name: animatedDemo
            label: Show the animated app demo
            type: boolean
            description: Plays a live copy on the phone instead of showing the image above.
          - name: stats
            label: Key numbers
            type: object
            list:
              max: 4
              collapsible:
                collapsed: true
                summary: "{value} {label}"
            fields:
              - name: icon
                component: icon
              - name: value
                type: string
                description: A number with an optional unit, like 100%, 0 or €3.50. Simple numbers count up; numbers with thousands separators are shown as typed.
              - name: label
                type: string

      - name: logos
        label: Compatibility strip
        type: object
        fields:
          - name: enabled
            component: enabled
          - name: title
            type: string
          - name: items
            label: Supported devices and formats
            type: string
            list: true
            description: Devices, drives and formats Reperoo supports. Not company or press logos.

      - name: features
        label: Features
        type: object
        fields:
          - name: enabled
            component: enabled
          - name: eyebrow
            component: eyebrow
          - name: title
            type: string
          - name: subtitle
            component: subtitle
          - name: items
            label: Features
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: icon
                component: icon
              - name: title
                type: string
              - name: description
                type: text

      - name: showcase
        label: How it works
        type: object
        fields:
          - name: enabled
            component: enabled
          - name: eyebrow
            component: eyebrow
          - name: title
            type: string
          - name: items
            label: Steps
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                type: string
              - name: text
                type: text
              - name: image
                type: image
              - name: imageAlt
                label: Image description
                type: string
              - name: bullets
                type: string
                list: true

      - name: testimonials
        label: Who it's for (personas)
        type: object
        fields:
          - name: enabled
            component: enabled
          - name: eyebrow
            component: eyebrow
          - name: title
            type: string
          - name: items
            label: Personas
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{name}"
            fields:
              - name: quote
                label: What they'd say
                type: text
                description: A typical need in this person's words. Not a customer review.
              - name: name
                type: string
              - name: role
                type: string
              - name: avatar
                label: Illustration
                type: image
                description: Optional. Initials are shown when empty.

      - name: pricing
        label: Pricing
        type: object
        fields:
          - name: enabled
            component: enabled
          - name: eyebrow
            component: eyebrow
          - name: title
            type: string
          - name: subtitle
            component: subtitle
          - name: currency
            type: string
          - name: note
            label: Small print under the plans
            type: text
          - name: plans
            type: object
            list:
              max: 3
              collapsible:
                collapsed: true
                summary: "{name}"
            fields:
              - name: name
                type: string
              - name: description
                type: text
              - name: price
                type: number
                description: 0 shows "Free".
              - name: priceSuffix
                label: Text after the price
                type: string
                description: For example "one-time" or "/ month".
              - name: badge
                label: Badge
                type: string
                description: Optional, for example "Launch price".
              - name: features
                type: string
                list: true
              - name: highlighted
                label: Highlight this plan
                type: boolean
              - name: ctaLabel
                label: Button label
                type: string
              - name: ctaHref
                label: Button link
                component: href

      - name: faq
        label: FAQ
        type: object
        fields:
          - name: enabled
            component: enabled
          - name: eyebrow
            component: eyebrow
          - name: title
            type: string
          - name: items
            label: Questions
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{question}"
            fields:
              - name: question
                type: string
              - name: answer
                type: text
              - name: link
                label: Read more link
                component: link
                description: Optional link shown under the answer.

      - name: blog
        label: Latest blog posts
        type: object
        fields:
          - name: enabled
            component: enabled
          - name: eyebrow
            component: eyebrow
          - name: title
            type: string
          - name: count
            label: Number of posts to show
            type: number
            options:
              min: 1
              max: 6

      - name: cta
        label: Call to action banner
        type: object
        fields:
          - name: enabled
            label: Show this section
            type: boolean
            description: Shown above the FAQ. The waitlist section already ends the page.
          - name: title
            type: string
          - name: text
            type: text
          - name: buttonLabel
            type: string
          - name: buttonHref
            label: Button link
            component: href

      - name: contact
        label: Waitlist
        type: object
        fields:
          - name: enabled
            component: enabled
          - name: eyebrow
            component: eyebrow
          - name: title
            type: string
          - name: text
            type: text
          - name: email
            type: string
            description: Leave empty until there is a monitored inbox.
          - name: phone
            type: string
          - name: address
            type: string
          - name: formAction
            label: Form endpoint URL
            type: string
            description: POST URL from your waitlist provider, for example Formspree or Getform. While empty, the live site shows the closed message instead of the form.
          - name: closedMessage
            label: Message shown while there is no form endpoint
            type: text
          - name: buttonLabel
            label: Form button label
            type: string
          - name: successMessage
            label: Message shown after joining
            type: text
          - name: privacyNote
            label: Privacy note under the button
            type: text
          - name: privacyLink
            label: Privacy link
            component: link
          - name: form
            label: Form text
            type: object
            fields:
              - name: emailLabel
                type: string
              - name: nameLabel
                type: string
              - name: messageLabel
                type: string
              - name: emailError
                type: text
              - name: successTitle
                type: string
              - name: errorMessage
                type: text

  - name: posts
    label: Blog posts
    type: collection
    path: content/posts
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: create
    view:
      fields: [title, date, author]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        type: string
        required: true
      - name: date
        type: date
        options:
          format: yyyy-MM-dd
      - name: author
        type: string
      - name: excerpt
        label: Summary
        type: text
        description: Shown on the blog overview and in search results.
      - name: cover
        label: Cover image
        type: image
      - name: body
        label: Content
        type: rich-text
        options:
          format: markdown

  - name: privacy
    label: Privacy policy
    type: file
    path: content/privacy.md
    format: yaml-frontmatter
    fields:
      - name: title
        type: string
        required: true
      - name: description
        label: Search description
        type: text
      - name: updated
        label: Last updated
        type: date
        options:
          format: yyyy-MM-dd
      - name: body
        label: Content
        type: rich-text
        options:
          format: markdown

  - name: site
    label: Site settings
    type: file
    path: content/site.json
    format: json
    fields:
      - name: name
        label: Site name
        type: string
        required: true
      - name: logo
        type: image
        description: Optional square mark shown next to the site name. The first letter is shown when empty.
      - name: seo
        label: Search engines
        type: object
        fields:
          - name: title
            type: string
          - name: description
            type: text
      - name: announcement
        label: Announcement bar
        type: object
        fields:
          - name: enabled
            label: Show the announcement bar
            type: boolean
          - name: text
            type: string
          - name: linkLabel
            type: string
          - name: href
            component: href
      - name: navigation
        label: Menu
        type: object
        list:
          max: 6
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - name: label
            type: string
          - name: href
            component: href
      - name: navCta
        label: Menu button
        component: link
      - name: footer
        type: object
        fields:
          - name: text
            type: text
          - name: columns
            label: Link columns
            type: object
            list:
              max: 4
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                type: string
              - name: links
                type: object
                list: true
                fields:
                  - name: label
                    type: string
                  - name: href
                    component: href
          - name: socials
            label: Social media
            type: object
            list: true
            description: Leave empty until the profiles exist.
            fields:
              - name: platform
                type: select
                options:
                  values:
                    - { name: linkedin, label: LinkedIn }
                    - { name: instagram, label: Instagram }
                    - { name: facebook, label: Facebook }
                    - { name: x, label: X }
                    - { name: youtube, label: YouTube }
              - name: href
                label: Link
                type: string
          - name: copyright
            type: string
      - name: blog
        label: Blog page
        type: object
        fields:
          - name: title
            type: string
          - name: lead
            label: Text under the title
            type: text
          - name: description
            label: Search description
            type: text
          - name: emptyText
            label: Text shown when there are no posts
            type: string
          - name: allPostsLabel
            label: "\"All posts\" link label"
            type: string
